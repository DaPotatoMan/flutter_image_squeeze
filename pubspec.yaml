name: image_squeeze
description: A simple Flutter package for resizing and compressing image bytes.
version: 0.0.2
homepage: https://github.com/DaPotatoMan/image_squeeze
topics:
  - image-compression
  - image-processing
  - image-resize

environment:
  sdk: ">=3.10.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  image: ">=4.0.0 <5.0.0"
  web: ">=1.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - path: assets/
      platforms: [web]
